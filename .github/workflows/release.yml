name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x86_64
            runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - name: Linux arm64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - name: Windows x86_64
            runner: windows-latest
            target: x86_64-pc-windows-msvc
          - name: Windows arm64
            runner: windows-latest
            target: aarch64-pc-windows-msvc
          - name: macOS x86_64
            runner: macos-13
            target: x86_64-apple-darwin
          - name: macOS arm64
            runner: macos-13
            target: aarch64-apple-darwin

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libusb-1.0-0-dev libudev-dev libxkbcommon-dev libgtk-3-dev

      - name: Install macOS dependencies
        if: runner.os == 'macOS'
        run: brew install libusb pkg-config

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build release
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package Linux or macOS
        if: runner.os != 'Windows'
        shell: bash
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/felica-rw dist/felica-rw
          cp README.md assets/OFL.txt dist/
          tar -czf felica-rw-${{ matrix.target }}.tar.gz -C dist .

      - name: Package Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item target/${{ matrix.target }}/release/felica-rw.exe dist/felica-rw.exe
          Copy-Item README.md, assets/OFL.txt dist/
          Compress-Archive -Path dist/* -DestinationPath felica-rw-${{ matrix.target }}.zip

      - name: Upload Linux or macOS release asset
        if: runner.os != 'Windows'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for attempt in 1 2 3 4 5; do
            if gh release view "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
              break
            fi
            gh release create "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" --generate-notes \
              --title "${GITHUB_REF_NAME}" >/dev/null 2>&1 || true
            sleep 2
          done
          gh release upload "${GITHUB_REF_NAME}" \
            "felica-rw-${{ matrix.target }}.tar.gz" \
            --repo "${GITHUB_REPOSITORY}" --clobber

      - name: Upload Windows release asset
        if: runner.os == 'Windows'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          for ($attempt = 1; $attempt -le 5; $attempt++) {
            gh release view "$env:GITHUB_REF_NAME" --repo "$env:GITHUB_REPOSITORY" *> $null
            if ($LASTEXITCODE -eq 0) { break }
            gh release create "$env:GITHUB_REF_NAME" --repo "$env:GITHUB_REPOSITORY" `
              --generate-notes --title "$env:GITHUB_REF_NAME" *> $null
            if ($LASTEXITCODE -eq 0) { break }
            Start-Sleep -Seconds 2
          }
          gh release upload "$env:GITHUB_REF_NAME" `
            "felica-rw-${{ matrix.target }}.zip" `
            --repo "$env:GITHUB_REPOSITORY" --clobber
