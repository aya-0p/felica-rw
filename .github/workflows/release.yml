name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x86_64
            runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - name: Windows x86_64
            runner: windows-latest
            target: x86_64-pc-windows-msvc
          - name: macOS x86_64
            runner: macos-13
            target: x86_64-apple-darwin
          - name: macOS arm64
            runner: macos-14
            target: aarch64-apple-darwin

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libusb-1.0-0-dev libudev-dev libxkbcommon-dev libgtk-3-dev

      - name: Install macOS dependencies
        if: runner.os == 'macOS'
        run: brew install libusb pkg-config

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build release
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package Linux or macOS
        if: runner.os != 'Windows'
        shell: bash
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/felica-rw dist/felica-rw
          cp README.md assets/OFL.txt dist/
          tar -czf felica-rw-${{ matrix.target }}.tar.gz -C dist .

      - name: Package Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item target/${{ matrix.target }}/release/felica-rw.exe dist/felica-rw.exe
          Copy-Item README.md, assets/OFL.txt dist/
          Compress-Archive -Path dist/* -DestinationPath felica-rw-${{ matrix.target }}.zip

      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.target }}
          path: |
            felica-rw-${{ matrix.target }}.tar.gz
            felica-rw-${{ matrix.target }}.zip
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/* \
            --repo "${GITHUB_REPOSITORY}" \
            --generate-notes
